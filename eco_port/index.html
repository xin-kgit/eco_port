<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco-Brutalist Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-theme="light">
    
    <div class="portfolio-container">

        <header class="bento-box">
            <span class="logo">🌿 Dev.Bento</span>
            <button id="themeToggle" class="btn">Meadow Mode</button>
        </header>
        
        <main class="bento-grid">
            <!-- Hero Card -->
            <section class="bento-box hero-card">
                <div id="mascot" data-mood="happy">🐸</div>
                <p id="mascot-status">🐸 Thriving in the Forest Canopy</p>
                <h1>Hi, I'm a MCA Student & Full-Stack Developer</h1>
                <p>Building eco-conscious, high-performance web apps with a raw, brutalist aesthetic.</p>
            </section>

            <!-- Stats Card (Fixed ID) -->
            <section class="bento-box stats-card">
                <h2>📊 Live Backend Metrics</h2>
                <div id="backend-status" class="metric-group">Connecting to FastAPI canopy...</div>
            </section>

            <!-- Contact Form Card (Added) -->
            <section class="bento-box contact-card">
                <h2>📬 Drop a Note</h2>
                <form id="contact-form" style="display: flex; flex-direction: column; gap: 0.75rem; margin-top: 1rem;">
                    <input type="text" id="name" placeholder="Your Name" required style="padding: 0.5rem; border: 2px solid #1a1a1a; font-family: monospace;">
                    <input type="email" id="email" placeholder="Your Email" required style="padding: 0.5rem; border: 2px solid #1a1a1a; font-family: monospace;">
                    <textarea id="message" placeholder="Your Message" required style="padding: 0.5rem; border: 2px solid #1a1a1a; font-family: monospace; min-height: 80px;"></textarea>
                    <button type="submit" class="btn">Send to Canopy</button>
                </form>
            </section>
        </main>

    </div>
    
    <script src="script.js"></script>
</body>
</html>
